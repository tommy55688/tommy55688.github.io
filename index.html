<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星展雙卡回饋計算器 Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- PDF.js (用於前端解析 PDF 帳單) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 內建 SVG 圖示
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Plus: <path d="M5 12h14m-7-7v14" />,
                Trash2: <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2m-6 9h.01m4 0h.01" />,
                Download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4m4-10 5 5 5-5m-5 5V3" />,
                Upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4m4-10-5-5-5 5m5-5v14" />,
                CreditCard: <><rect width="20" height="14" x="2" y="5" rx="2" /><path d="M2 10h20" /></>,
                Calendar: <><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><path d="M16 2v4M8 2v4M3 10h18" /></>,
                Monitor: <><rect width="20" height="14" x="2" y="3" rx="2" /><path d="M8 21h8m-4-4v4" /></>,
                Smartphone: <><rect width="14" height="20" x="5" y="2" rx="2" ry="2" /><path d="M12 18h.01" /></>,
                AlertCircle: <><circle cx="12" cy="12" r="10" /><path d="M12 8v4m0 4h.01" /></>,
                CheckCircle2: <><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></>,
                TrendingUp: <path d="m22 7-8.5 8.5L9 11 2 18m14-11h6v6" />,
                History: <><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5m4 4V7" /></>,
                ChevronLeft: <path d="m15 18-6-6 6-6" />,
                ChevronRight: <path d="m9 18 6-6-6-6" />,
                FileText: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" /><polyline points="14 2 14 8 20 8" /></>,
                Target: <><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></>,
                Sparkles: <><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z" /><path d="M20.5 3.5 19 5l1.5 1.5L22 5Z" /><path d="M3.5 20.5 5 19l-1.5-1.5L2 19Z" /></>,
                Loader2: <path d="M21 12a9 9 0 1 1-6.219-8.56" />,
                Pencil: <><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /><path d="m15 5 4 4" /></>,
                X: <><path d="M18 6 6 18" /><path d="m6 6 12 12" /></>
            };

            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const App = () => {
            const [viewMode, setViewMode] = useState('pc'); 
            const [activeTab, setActiveTab] = useState('eco_linepay'); 
            
            const [aiAnalysis, setAiAnalysis] = useState("");
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [showAiModal, setShowAiModal] = useState(false);
            
            const [pdfPointsInfo, setPdfPointsInfo] = useState(() => localStorage.getItem('dbs_pdf_points') || "");

            const fileInputRef = useRef(null);
            const pdfInputRef = useRef(null);

            const today = new Date();
            const [filterYear, setFilterYear] = useState(today.getFullYear());
            const [filterMonth, setFilterMonth] = useState(today.getMonth());

            const [auditYear, setAuditYear] = useState(today.getFullYear());
            const [auditMonth, setAuditMonth] = useState(today.getMonth());

            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('dbs_transactions_v7');
                if (saved) return JSON.parse(saved);
                const savedV6 = localStorage.getItem('dbs_transactions_v6');
                if (savedV6) {
                    return JSON.parse(savedV6).map(t => ({ ...t, card: t.card === 'eco' ? 'eco_linepay' : t.card }));
                }
                return [];
            });

            const [form, setForm] = useState({
                date: new Date().toISOString().split('T')[0],
                card: 'eco_linepay',
                name: '',
                amount: ''
            });

            const [editingId, setEditingId] = useState(null);
            const [editForm, setEditForm] = useState({});

            useEffect(() => {
                if (window.pdfjsLib) {
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('dbs_transactions_v7', JSON.stringify(transactions));
                localStorage.setItem('dbs_pdf_points', pdfPointsInfo);
            }, [transactions, pdfPointsInfo]);

            const CARD_CONFIG = {
                eco_linepay: { name: 'eco 卡 (Line Pay 9%)', shortName: 'eco (Line Pay)', baseRate: 0.01, bonusRate: 0.09, spendCap: 11111, bonusPointCap: 1000 },
                eco_overseas: { name: 'eco 卡 (海外 4%)', shortName: 'eco (海外)', baseRate: 0.01, bonusRate: 0.04, spendCap: 15000, bonusPointCap: 600 },
                legend: { name: '傳說對決卡', shortName: '傳說卡', baseRate: 0.002, bonusRate: 0.098, spendCap: 11363, bonusPointCap: 1000 }
            };

            const getCardTheme = (cardKey) => {
                switch(cardKey) {
                    case 'legend': return { text: 'text-blue-700', badge: 'bg-blue-100 text-blue-700', border: 'border-l-4 border-l-blue-500' };
                    case 'eco_overseas': return { text: 'text-purple-700', badge: 'bg-purple-100 text-purple-700', border: 'border-l-4 border-l-purple-500' };
                    default: return { text: 'text-green-700', badge: 'bg-green-100 text-green-700', border: 'border-l-4 border-l-green-500' };
                }
            };

            const formatDateLocal = (date) => {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            };

            const callGeminiAPI = async (prompt) => {
                const apiKey = "";
                if (!apiKey || !navigator.onLine) {
                    return "目前處於離線模式或未設定 API 金鑰，無法提供 AI 分析建議。您可以繼續使用本機的記帳與計算功能！";
                }
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: "你是一位專業的星展信用卡理財助手。請分析使用者的消費數據，給予簡短、專業且具備繁體中文口吻的理財建議。著重於如何最大化各卡別的加碼回饋。" }] }
                };

                for (let i = 0; i < 3; i++) {
                    try {
                        const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        if (!response.ok) throw new Error('API Error');
                        const data = await response.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text;
                    } catch (error) {
                        if (i === 2) throw error;
                        await new Promise(r => setTimeout(r, 1000));
                    }
                }
            };

            const processedData = useMemo(() => {
                // 將這裡的排序從升序改為降序，讓最新的日期排在最前面
                const sorted = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
                const monthlyUsage = {}; 

                // 注意：由於現在是降序（最新的在前面），在計算每月的累積額度時，
                // 我們需要先將陣列反轉回升序，計算完各筆的累積狀態後，再反轉回降序顯示。
                const ascendingSorted = [...sorted].reverse();
                
                const calculatedDataAscending = ascendingSorted.map((t) => {
                    const dateObj = new Date(t.date);
                    const day = dateObj.getDate();
                    const amount = parseFloat(t.amount) || 0;
                    const configKey = CARD_CONFIG[t.card] ? t.card : 'eco_linepay'; 
                    const config = CARD_CONFIG[configKey];

                    const consumeMonthKey = `${dateObj.getFullYear()}-${dateObj.getMonth()}_${configKey}`;
                    const prevSpend = monthlyUsage[consumeMonthKey] || 0;
                    
                    const eligibleForBonus = Math.max(0, Math.min(amount, config.spendCap - prevSpend));
                    const exceeded = Math.max(0, amount - eligibleForBonus);
                    monthlyUsage[consumeMonthKey] = prevSpend + amount;

                    let billYear = dateObj.getFullYear();
                    let billMonth = dateObj.getMonth();
                    if (day >= 12) {
                        billMonth += 1;
                        if (billMonth > 11) { billMonth = 0; billYear += 1; }
                    }
                    const billingCycleStr = `${billYear}/${String(billMonth + 1).padStart(2, '0')} 帳單`;

                    const rewardBase = Math.round(amount * config.baseRate);
                    const rewardBonus = Math.round(eligibleForBonus * config.bonusRate);
                    const creditDateBonusObj = new Date(dateObj.getFullYear(), dateObj.getMonth() + 2, 1);
                    
                    return {
                        ...t, card: configKey, eligibleForBonus, exceeded, rewardBase, rewardBonus, totalReward: rewardBase + rewardBonus,
                        billingCycle: billingCycleStr, creditDateBonus: formatDateLocal(creditDateBonusObj),
                        baseRateLabel: (config.baseRate * 100).toFixed(1) + '%', bonusRateLabel: (config.bonusRate * 100).toFixed(1) + '%',
                        currentCap: config.spendCap,
                        billYear: billYear,
                        billMonth: billMonth
                    };
                });

                // 計算完畢後，再次反轉回降序，供列表顯示
                return calculatedDataAscending.reverse();

            }, [transactions]);

            const summary = useMemo(() => {
                const config = CARD_CONFIG[activeTab];
                const dataInMonth = processedData.filter(t => {
                    const d = new Date(t.date);
                    return d.getFullYear() === filterYear && d.getMonth() === filterMonth && t.card === activeTab;
                });

                const totalSpent = dataInMonth.reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);
                const totalBonusPoints = dataInMonth.reduce((sum, t) => sum + t.rewardBonus, 0);
                const remainingQuota = Math.max(0, config.spendCap - totalSpent);
                const isReached = totalSpent >= config.spendCap;
                const isPointsMax = totalBonusPoints >= config.bonusPointCap;

                return { totalSpent, totalBonusPoints, remainingQuota, isReached, isPointsMax, percent: Math.min(100, (totalSpent / config.spendCap) * 100), dataInMonth, currentCap: config.spendCap, bonusPointCap: config.bonusPointCap };
            }, [processedData, activeTab, filterMonth, filterYear]);

            const filterBillingCycleStr = `${auditYear}/${String(auditMonth + 1).padStart(2, '0')} 帳單`;
            
            const allCardsBaseThisBill = useMemo(() => {
                return processedData
                    .filter(t => t.billingCycle === filterBillingCycleStr)
                    .reduce((sum, t) => sum + t.rewardBase, 0);
            }, [processedData, filterBillingCycleStr]);

            const allCardsBonusThisCalendar = useMemo(() => {
                return processedData
                    .filter(t => {
                        const d = new Date(t.date);
                        return d.getFullYear() === auditYear && d.getMonth() === auditMonth;
                    })
                    .reduce((sum, t) => sum + t.rewardBonus, 0);
            }, [processedData, auditYear, auditMonth]);

            const handleAiAnalysis = async () => {
                setIsAiLoading(true);
                setShowAiModal(true);
                try {
                    const spendDesc = summary.dataInMonth.map(t => `${t.name}($${t.amount})`).join(', ');
                    const prompt = `當前分析卡別：${CARD_CONFIG[activeTab].name}\n查詢月份：${filterYear}年${filterMonth + 1}月\n目前已消費：$${summary.totalSpent}\n本卡別加碼上限：$${summary.currentCap}\n剩餘加碼額度：$${summary.remainingQuota}\n目前已領加碼點數：${summary.totalBonusPoints} 點 (上限 ${summary.bonusPointCap} 點)\n本月消費明細：${spendDesc || '無'}\n請根據以上資訊，給予這張卡片 3 點具體的理財策略建議，以極大化回饋。`;
                    const result = await callGeminiAPI(prompt);
                    setAiAnalysis(result);
                } catch (err) {
                    setAiAnalysis("AI 分析暫時無法使用，請確認網路連線。");
                } finally {
                    setIsAiLoading(false);
                }
            };

            const addTransaction = (e) => {
                e.preventDefault();
                if (!form.amount || !form.name) return;
                setTransactions([...transactions, { ...form, amount: parseFloat(form.amount), id: Date.now() }]);
                const d = new Date(form.date);
                setFilterYear(d.getFullYear());
                setFilterMonth(d.getMonth());
                setAuditYear(d.getFullYear());
                setAuditMonth(d.getMonth());
                setActiveTab(form.card);
                setForm({ ...form, name: '', amount: '' });
            };

            const deleteTransaction = (id) => {
                if(confirm("確定要刪除這筆紀錄嗎？")) setTransactions(transactions.filter(t => t.id !== id));
            };

            const startEdit = (t) => {
                setEditingId(t.id);
                setEditForm({ date: t.date, card: t.card, name: t.name, amount: t.amount });
            };

            const cancelEdit = () => {
                setEditingId(null);
                setEditForm({});
            };

            const saveEdit = () => {
                if (!editForm.amount || !editForm.name) { alert("請填寫完整的消費項目與金額"); return; }
                setTransactions(transactions.map(t => t.id === editingId ? { ...t, ...editForm, amount: parseFloat(editForm.amount) } : t));
                setEditingId(null);
                setEditForm({});
            };

            const changeMonth = (offset) => {
                let newMonth = filterMonth + offset;
                let newYear = filterYear;
                if (newMonth < 0) { newMonth = 11; newYear -= 1; }
                else if (newMonth > 11) { newMonth = 0; newYear += 1; }
                setFilterMonth(newMonth);
                setFilterYear(newYear);
            };

            const changeAuditMonth = (offset) => {
                let newMonth = auditMonth + offset;
                let newYear = auditYear;
                if (newMonth < 0) { newMonth = 11; newYear -= 1; }
                else if (newMonth > 11) { newMonth = 0; newYear += 1; }
                setAuditMonth(newMonth);
                setAuditYear(newYear);
            };

            const exportToExcel = () => {
                if (processedData.length === 0) { alert("目前沒有資料可以匯出。"); return; }
                // 匯出時也維持最新的在最上面
                const headers = ["日期", "信用卡", "品名", "消費金額", "帳單週期", "基本回饋率", "基本點數", "加碼回饋率", "加碼點數", "加碼入帳日", "超額不計入金額"];
                const rows = processedData.map(t => [t.date, CARD_CONFIG[t.card].name, t.name, t.amount, t.billingCycle, t.baseRateLabel, t.rewardBase, t.bonusRateLabel, t.rewardBonus, t.creditDateBonus, t.exceeded]);
                const csvContent = "\uFEFF" + [headers, ...rows].map(e => e.join(",")).join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `星展回饋明細匯出_${formatDateLocal(new Date())}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const importFromExcel = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const lines = text.split('\n').filter(l => l.trim() !== '');
                    if (lines.length <= 1) { alert('檔案無資料或格式不符'); return; }
                    const newTransactions = [];
                    for (let i = 1; i < lines.length; i++) {
                        const row = lines[i].split(',');
                        if (row.length < 4) continue;
                        let date = row[0].replace(/['"]/g, '').trim();
                        let cardStr = row[1].replace(/['"]/g, '').trim();
                        let name = row[2].replace(/['"]/g, '').trim();
                        let amount = parseFloat(row[3].replace(/['"]/g, '').trim());
                        if (isNaN(amount) || !date || !name) continue;

                        let cardKey = 'eco_linepay'; 
                        if (cardStr.includes('傳說')) cardKey = 'legend';
                        else if (cardStr.includes('海外') || cardStr.includes('4%')) cardKey = 'eco_overseas';
                        
                        newTransactions.push({ id: Date.now() + i + Math.random(), date, card: cardKey, name, amount });
                    }
                    if (newTransactions.length > 0) {
                        setTransactions(prev => [...prev, ...newTransactions]);
                        alert(`成功匯入 ${newTransactions.length} 筆資料！`);
                    } else {
                        alert('找不到有效的消費紀錄，請確認檔案格式是否為先前的匯出檔。');
                    }
                };
                reader.readAsText(file);
                if(fileInputRef.current) fileInputRef.current.value = '';
            };

            // 匯入 PDF 功能
            const importFromPdf = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsAiLoading(true);
                setShowAiModal(true);
                setAiAnalysis("正在啟動 PDF 智慧解析引擎，嚴格讀取您的電子帳單中...");
                
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    
                    let lines = [];
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        
                        const yMap = {};
                        textContent.items.forEach(item => {
                            const str = item.str.trim();
                            if (!str) return;
                            const y = item.transform[5];
                            let assignedY = Object.keys(yMap).find(k => Math.abs(Number(k) - y) < 8);
                            if (!assignedY) assignedY = y;
                            if (!yMap[assignedY]) yMap[assignedY] = [];
                            yMap[assignedY].push(item);
                        });

                        const yKeys = Object.keys(yMap).map(Number).sort((a, b) => b - a);
                        yKeys.forEach(y => {
                            yMap[y].sort((a, b) => a.transform[4] - b.transform[4]);
                            const lineText = yMap[y].map(item => item.str.trim()).filter(s => s).join(' ');
                            if (lineText) lines.push(lineText);
                        });
                    }

                    let currentCard = 'eco_linepay'; 
                    let newTxs = [];
                    let pendingTx = null;
                    
                    const fullText = lines.join(' ');
                    const pointsMatch = fullText.match(/現金積點[\s\S]*?逾期點數[^\s。]*(?:。|,)?/);
                    if (pointsMatch) {
                        setPdfPointsInfo(pointsMatch[0]);
                    }

                    lines.forEach(line => {
                        const lineNoSpaces = line.replace(/\s+/g, '').toUpperCase();
                        
                        if (lineNoSpaces.includes('傳說對決') || lineNoSpaces.includes('傳說經典')) {
                            currentCard = 'legend';
                            pendingTx = null;
                        } else if (lineNoSpaces.includes('ECO永續卡')) {
                            currentCard = 'eco_linepay'; 
                            pendingTx = null;
                        }

                        if (pendingTx && /^([\d,\.]+)$/.test(line.trim())) {
                            const amount = parseFloat(line.replace(/,/g, ''));
                            if (!isNaN(amount) && amount > 0) {
                                pendingTx.amount = amount;
                                newTxs.push(pendingTx);
                            }
                            pendingTx = null;
                            return;
                        }

                        const fullTxMatch = line.match(/^(20\d{2}\/\d{2}\/\d{2})\s+(.+?)\s+([\d,\.]+)$/i);
                        if (fullTxMatch) {
                            const date = fullTxMatch[1].replace(/\//g, '-');
                            let rawName = fullTxMatch[2].trim();
                            
                            if (rawName.includes('小計') || rawName.includes('應繳金額') || rawName.includes('自動扣繳')) return;
                            
                            let name = rawName.replace(/20\d{2}\/\d{2}\/\d{2}/g, '').trim();
                            const amount = parseFloat(fullTxMatch[3].replace(/,/g, ''));
                            
                            if (!isNaN(amount) && amount > 0) {
                                newTxs.push({ id: Date.now() + Math.random(), date, card: currentCard, name, amount });
                            }
                            pendingTx = null;
                            return;
                        }

                        const partialTxMatch = line.match(/^(20\d{2}\/\d{2}\/\d{2})\s+(.+)$/i);
                        if (partialTxMatch) {
                            const date = partialTxMatch[1].replace(/\//g, '-');
                            let rawName = partialTxMatch[2].trim();
                            
                            if (rawName.includes('小計') || rawName.includes('應繳金額') || rawName.includes('自動扣繳')) return;
                            
                            let name = rawName.replace(/20\d{2}\/\d{2}\/\d{2}/g, '').trim();
                            pendingTx = { id: Date.now() + Math.random(), date, card: currentCard, name };
                        }
                    });

                    if (newTxs.length > 0) {
                        setTransactions(prev => [...prev, ...newTxs]);

                                                <div className="flex justify-between items-start mb-5">
                                                    <div>
                                                        <div className="text-[10px] text-slate-400 mb-1 flex items-center gap-1.5 font-bold uppercase tracking-widest">
                                                            <Icon name="Calendar" size={12} className="text-slate-300"/> {t.date} 
                                                            <span className={`px-2 py-0.5 rounded-full text-[8px] font-black ${theme.badge}`}>
                                                                {CARD_CONFIG[t.card].shortName}
                                                            </span>
                                                        </div>
                                                        <h4 className={`font-black text-xl ${theme.text}`}>{t.name}</h4>
                                                    </div>
                                                    <div className="text-2xl font-black text-slate-900">${parseInt(t.amount).toLocaleString()}</div>
                                                </div>
                                                
                                                <div className="grid grid-cols-3 gap-2 pt-5 border-t border-slate-50">
                                                    <div className="bg-slate-50 p-2.5 rounded-2xl text-center">
                                                        <p className="text-[8px] text-slate-400 font-black mb-1 uppercase tracking-tighter">基本 ({t.baseRateLabel})</p>
                                                        <p className="text-sm font-black text-slate-700">+{t.rewardBase}</p>
                                                    </div>
                                                    <div className="bg-red-50 p-2.5 rounded-2xl text-center col-span-2">
                                                        <p className="text-[8px] text-red-400 font-black mb-1 uppercase tracking-tighter">加碼 ({t.bonusRateLabel})</p>
                                                        <div className="flex justify-between items-center px-2">
                                                            <span className="text-sm font-black text-red-600">+{t.rewardBonus}</span>
                                                            <span className="text-[9px] font-bold text-red-300 italic">{t.creditDateBonus} 入帳</span>
                                                        </div>
                                                    </div>
                                                </div>
                                                
                                                <div className="mt-4 flex justify-between items-center">
                                                    <span className="text-[10px] font-bold text-slate-300">{t.billingCycle}</span>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => startEdit(t)} className="p-2 text-slate-300 hover:text-blue-500 transition-colors">
                                                            <Icon name="Pencil" size={18} />
                                                        </button>
                                                        <button onClick={() => deleteTransaction(t.id)} className="p-2 text-slate-300 hover:text-red-500 transition-colors">
                                                            <Icon name="Trash2" size={18} />
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            )}
                        </section>
                    </main>

                    {/* Bottom Nav Bar (Mobile) */}
                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-11/12 max-w-sm bg-slate-900/90 backdrop-blur-xl p-3 px-6 rounded-[2rem] flex justify-between shadow-2xl z-50 md:hidden border border-white/10">
                        <button onClick={() => pdfInputRef.current.click()} className="flex flex-col items-center gap-1 text-indigo-400 hover:text-indigo-300 transition-colors">
                            <Icon name="FileText" size={24} />
                            <span className="text-[9px] font-bold tracking-wider">匯入 PDF</span>
                        </button>
                        <button onClick={() => fileInputRef.current.click()} className="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-300 transition-colors">
                            <Icon name="Upload" size={24} />
                            <span className="text-[9px] font-bold tracking-wider">匯入 CSV</span>
                        </button>
                        <button onClick={exportToExcel} className="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-300 transition-colors">
                            <Icon name="Download" size={24} />
                            <span className="text-[9px] font-bold tracking-wider">匯出 CSV</span>
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
